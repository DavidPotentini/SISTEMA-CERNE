<mat-card class="cartao">
  <div class="cabecalho">
    <h2>Ciclos</h2>
    <button mat-flat-button color="primary" (click)="adicionar()">Adicionar novo ciclo</button>
  </div>

  @if (dados.error()) {
    <p class="erro">Falha ao carregar os ciclos.</p>
  }

  @if (dados.value(); as lista) {
    <table mat-table [dataSource]="lista" class="tabela">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let c">
          {{ c.nome }}
          @if (c.emFoco) {
            <span class="tag-foco">Em foco</span>
          }
        </td>
      </ng-container>
      <ng-container matColumnDef="periodo">
        <th mat-header-cell *matHeaderCellDef>Período</th>
        <td mat-cell *matCellDef="let c">{{ periodo(c) }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let c">
          <span class="chip" [class]="'s-' + c.status">{{ statusLabel(c.status) }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let c" class="acoes">
          @if (!c.emFoco) {
            <button mat-button (click)="porEmFoco(c)">Pôr em foco</button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas"></tr>
    </table>

    @if (lista.length === 0) {
      <p class="vazio">Nenhum ciclo cadastrado.</p>
    }
  }
</mat-card>
