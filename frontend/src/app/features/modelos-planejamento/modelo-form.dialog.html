<h2 mat-dialog-title>{{ edicao ? 'Editar modelo' : 'Novo modelo' }}</h2>
<mat-dialog-content>
  @if (!edicao) {
    <p class="contexto">Baseado na última versão vigente da metodologia.</p>
  }

  <div class="grid">
    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput [ngModel]="nome()" (ngModelChange)="nome.set($event)" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Periodicidade</mat-label>
      <mat-select [ngModel]="periodicidade()" (ngModelChange)="periodicidade.set($event)">
        @for (p of periodicidades; track p[0]) {
          <mat-option [value]="p[0]">{{ p[1] }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Descrição</mat-label>
      <textarea
        matInput
        rows="3"
        [ngModel]="descricao()"
        (ngModelChange)="descricao.set($event)"
      ></textarea>
    </mat-form-field>
  </div>

  @if (erro()) {
    <p class="erro">{{ erro() }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="salvando()">Cancelar</button>
  <button
    mat-flat-button
    color="primary"
    (click)="salvar()"
    [disabled]="salvando() || !nome().trim()"
  >
    {{ edicao ? 'Salvar' : 'Criar modelo' }}
  </button>
</mat-dialog-actions>
