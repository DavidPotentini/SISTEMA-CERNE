<h2 mat-dialog-title>{{ edicao ? 'Editar processo' : 'Novo processo' }}</h2>
<mat-dialog-content>
  <div class="grid">
    <mat-form-field appearance="outline" class="ordem">
      <mat-label>Ordem</mat-label>
      <input matInput type="number" min="1" [ngModel]="ordem()" (ngModelChange)="ordem.set($event)" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="nome">
      <mat-label>Nome</mat-label>
      <input matInput [ngModel]="nome()" (ngModelChange)="nome.set($event)" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="col-2">
      <mat-label>Descrição</mat-label>
      <textarea matInput rows="3" [ngModel]="descricao()" (ngModelChange)="descricao.set($event)"></textarea>
    </mat-form-field>
  </div>

  @if (erro()) {
    <p class="erro">{{ erro() }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="salvando()">Cancelar</button>
  <button
    mat-flat-button
    color="primary"
    (click)="salvar()"
    [disabled]="salvando() || !nome().trim() || ordem() == null"
  >
    {{ edicao ? 'Salvar' : 'Criar processo' }}
  </button>
</mat-dialog-actions>
