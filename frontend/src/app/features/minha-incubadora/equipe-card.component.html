<mat-card class="cartao">
  <h2>Equipe vinculada</h2>

  @if (equipe.error()) {
    <p class="erro">Falha ao carregar a equipe.</p>
  }

  @if (equipe.value(); as lista) {
    <table mat-table [dataSource]="lista" class="tabela">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let p">{{ p.nome }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>E-mail</th>
        <td mat-cell *matCellDef="let p">{{ p.email }}</td>
      </ng-container>
      <ng-container matColumnDef="papel">
        <th mat-header-cell *matHeaderCellDef>Papel</th>
        <td mat-cell *matCellDef="let p">{{ p.papel || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="situacao">
        <th mat-header-cell *matHeaderCellDef>Situação</th>
        <td mat-cell *matCellDef="let p">
          <span class="chip" [class]="'s-' + p.situacao">{{ situacaoLabel(p.situacao) }}</span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas"></tr>
    </table>

    @if (lista.length === 0) {
      <p class="vazio">Nenhuma pessoa vinculada à incubadora.</p>
    }
  }
</mat-card>
